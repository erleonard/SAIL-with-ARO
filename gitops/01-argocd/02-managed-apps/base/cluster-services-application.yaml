apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-services
  namespace: openshift-gitops
spec:
  project: cluster-bootstrap
  source:
    repoURL: https://github.com/erleonard/SAIL-with-ARO.git
    targetRevision: main
    path: set/in/overlay
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true