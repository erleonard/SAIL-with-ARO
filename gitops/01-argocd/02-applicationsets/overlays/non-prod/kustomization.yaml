apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openshift-gitops

resources:
  - ../../base

# The environment is selected once per category here, rather than once per
# component. Only the discovery path and the environment label differ.
patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: ApplicationSet
      name: cluster-config
    patch: |-
      - op: replace
        path: /spec/generators/0/git/files/0/path
        value: gitops/02-cluster-config/*/overlays/non-prod/appset-config.yaml
      - op: replace
        path: /spec/template/metadata/labels/environment
        value: non-prod
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: ApplicationSet
      name: cluster-services
    patch: |-
      - op: replace
        path: /spec/generators/0/git/files/0/path
        value: gitops/03-cluster-services/*/overlays/non-prod/appset-config.yaml
      - op: replace
        path: /spec/template/metadata/labels/environment
        value: non-prod
