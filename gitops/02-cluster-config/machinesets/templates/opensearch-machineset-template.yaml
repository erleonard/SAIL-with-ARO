apiVersion: machine.openshift.io/v1beta1
kind: MachineSet
metadata:
  name: __CLUSTER_ID__-__ROLE__-__ZONE__
  namespace: openshift-machine-api
  labels:
    machine.openshift.io/cluster-api-cluster: __CLUSTER_ID__
spec:
  replicas: __REPLICAS__
  selector:
    matchLabels:
      machine.openshift.io/cluster-api-cluster: __CLUSTER_ID__
      machine.openshift.io/cluster-api-machineset: __CLUSTER_ID__-__ROLE__-__ZONE__
  template:
    metadata:
      labels:
        machine.openshift.io/cluster-api-cluster: __CLUSTER_ID__
        machine.openshift.io/cluster-api-machine-role: __ROLE__
        machine.openshift.io/cluster-api-machine-type: __ROLE__
        machine.openshift.io/cluster-api-machineset: __CLUSTER_ID__-__ROLE__-__ZONE__
        node-role.kubernetes.io/__ROLE__: ""
    spec:
      metadata:
        labels:
          node-role.kubernetes.io/__ROLE__: ""
      providerSpec:
        value:
          apiVersion: azureproviderconfig.openshift.io/v1beta1
          kind: AzureMachineProviderSpec
          location: __REGION__
          resourceGroup: __RESOURCE_GROUP__
          vnet: __VNET__
          subnet: __SUBNET__
          networkResourceGroup: __NETWORK_RESOURCE_GROUP__
          vmSize: __VM_SIZE__
          zone: "__ZONE__"
          osDisk:
            diskSizeGB: 128
            managedDisk:
              storageAccountType: Premium_LRS
            osType: Linux
          credentialsSecret:
            name: azure-cloud-credentials
          userDataSecret:
            name: worker-user-data