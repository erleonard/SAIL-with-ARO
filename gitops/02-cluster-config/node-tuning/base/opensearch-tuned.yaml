apiVersion: tuned.openshift.io/v1
kind: Tuned
metadata:
  name: custom-vm-max-map-count
  namespace: openshift-cluster-node-tuning-operator
spec:
  profile:
    - data: |
        [main]
        summary=Set vm.max_map_count for workloads (e.g. OpenSearch)
        include=openshift-node
        [sysctl]
        vm.max_map_count=262144
      name: custom-vm-max-map-profile
  recommend:
    - match:
        - label: tuned.custom/vm-max-map
          value: "true"
      priority: 20
      profile: custom-vm-max-map-profile