apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nvidia-gpu-operator

resources:
  - ../../base

patches:
  - target:
      kind: ClusterPolicy
      name: gpu-cluster-policy
    patch: |
      - op: add
        path: /spec/operator/nodeSelector
        value:
          node-role.kubernetes.io/gpu: ""
      - op: add
        path: /spec/gpuFeatureDiscovery/nodeSelector
        value:
          node-role.kubernetes.io/gpu: ""
      - op: add
        path: /spec/migManager/nodeSelector
        value:
          node-role.kubernetes.io/gpu: ""