apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cluster-bootstrap
  namespace: openshift-gitops
spec:
  description: Root project for cluster bootstrap process
  sourceRepos:
  - '*'
  destinations:
  - namespace: '*'
    server: '*'
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
  roles:
  - name: admin
    description: Admins have all permissions
    policies:
    - p, proj:cluster-bootstrap:admin, applications, *, cluster-bootstrap/* allow
    groups:
    - argocd-admins