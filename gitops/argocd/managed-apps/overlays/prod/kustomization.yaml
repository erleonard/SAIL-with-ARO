namespace: openshift-gitops

resources:
  - ../../base

patches:
- patch: |-
    apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: cluster-config
    spec:
      source:
        path: gitops/argocd/applications/cluster-config/00-prod
- patch: |-
    apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: cluster-services
    spec:
      source:
        path: gitops/argocd/applications/cluster-services/prod