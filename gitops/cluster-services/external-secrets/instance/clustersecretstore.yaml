apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: keyvault
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: "https://<your-keyvault-name>.vault.azure.net"
      serviceAccountRef:
        name: external-secrets-sa
        namespace: external-secrets-operator