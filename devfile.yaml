schemaVersion: 2.2.0
metadata:
  name: sail-with-aro
  displayName: SAIL with ARO
  description: Bicep/Azure CLI tooling for the ARO landing-zone IaC
  language: Bicep
  projectType: Azure
  tags:
    - Bicep
    - Azure
    - ARO
    - PowerShell

components:
  - name: tools
    volume:
      size: 3Gi

  - name: iac
    container:
      image: quay.io/devfile/universal-developer-image:ubi9-latest
      memoryRequest: 1Gi
      memoryLimit: 6Gi
      cpuRequest: 200m
      cpuLimit: 2000m
      mountSources: true
      volumeMounts:
        - name: tools
          path: /home/user/.tools
      env:
        # Bump these to move the pinned tool versions.
        - name: BICEP_VERSION
          value: v0.46.1
        - name: PWSH_VERSION
          value: 7.4.6
        - name: OPENCODE_VERSION
          value: v1.18.7
        - name: GH_VERSION
          value: 2.67.0
        - name: TOOLS_HOME
          value: /home/user/.tools

commands:
  # Installs Bicep, Azure CLI and PowerShell into the persistent `tools` volume.
  # Idempotent: re-running only installs what is missing.
  - id: install-tooling
    exec:
      component: iac
      workingDir: ${PROJECT_SOURCE}
      label: Install Bicep, Azure CLI and PowerShell
      commandLine: |
        set -euo pipefail
        mkdir -p "$TOOLS_HOME/bin" "$HOME/.local/bin"

        # Reinstall when the pinned version moves, not just when Bicep is absent:
        # the tools volume outlives a version bump.
        if ! "$TOOLS_HOME/bin/bicep" --version 2>/dev/null | grep -qF "${BICEP_VERSION#v}"; then
          echo "==> Installing Bicep $BICEP_VERSION"
          curl -fsSL -o "$TOOLS_HOME/bin/bicep" \
            "https://github.com/Azure/bicep/releases/download/${BICEP_VERSION}/bicep-linux-x64"
          chmod +x "$TOOLS_HOME/bin/bicep"
        fi

        if [ ! -x "$TOOLS_HOME/azure-cli/bin/az" ]; then
          echo "==> Installing Azure CLI"
          python3 -m venv "$TOOLS_HOME/azure-cli"
          "$TOOLS_HOME/azure-cli/bin/python" -m pip install --quiet --upgrade pip
          "$TOOLS_HOME/azure-cli/bin/python" -m pip install --quiet azure-cli
        fi

        if [ ! -x "$TOOLS_HOME/pwsh/pwsh" ]; then
          echo "==> Installing PowerShell $PWSH_VERSION"
          mkdir -p "$TOOLS_HOME/pwsh"
          curl -fsSL \
            "https://github.com/PowerShell/PowerShell/releases/download/v${PWSH_VERSION}/powershell-${PWSH_VERSION}-linux-x64.tar.gz" \
            | tar -xz -C "$TOOLS_HOME/pwsh"
          chmod +x "$TOOLS_HOME/pwsh/pwsh"
        fi

        if ! "$TOOLS_HOME/bin/opencode" --version 2>/dev/null | grep -qF "${OPENCODE_VERSION#v}"; then
          echo "==> Installing OpenCode $OPENCODE_VERSION"
          mkdir -p "$TOOLS_HOME/opencode-tmp"
          curl -fsSL \
            "https://github.com/anomalyco/opencode/releases/download/${OPENCODE_VERSION}/opencode-linux-x64.tar.gz" \
            | tar -xz -C "$TOOLS_HOME/opencode-tmp"
          mv "$TOOLS_HOME/opencode-tmp/opencode" "$TOOLS_HOME/bin/opencode"
          rm -rf "$TOOLS_HOME/opencode-tmp"
          chmod +x "$TOOLS_HOME/bin/opencode"
        fi

        if ! "$TOOLS_HOME/bin/gh" --version 2>/dev/null | grep -qF "${GH_VERSION}"; then
          echo "==> Installing GitHub CLI $GH_VERSION"
          mkdir -p "$TOOLS_HOME/gh-tmp"
          curl -fsSL \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$TOOLS_HOME/gh-tmp"
          mv "$TOOLS_HOME/gh-tmp/gh_${GH_VERSION}_linux_amd64/bin/gh" "$TOOLS_HOME/bin/gh"
          rm -rf "$TOOLS_HOME/gh-tmp"
          chmod +x "$TOOLS_HOME/bin/gh"
        fi

        # $HOME/.local/bin is already on PATH in the universal developer image,
        # but $HOME is not always persisted, so relink on every start.
        ln -sf "$TOOLS_HOME/bin/bicep"        "$HOME/.local/bin/bicep"
        ln -sf "$TOOLS_HOME/azure-cli/bin/az" "$HOME/.local/bin/az"
        ln -sf "$TOOLS_HOME/pwsh/pwsh"        "$HOME/.local/bin/pwsh"
        ln -sf "$TOOLS_HOME/bin/opencode"     "$HOME/.local/bin/opencode"
        ln -sf "$TOOLS_HOME/bin/gh"           "$HOME/.local/bin/gh"

        # Use the Bicep binary above instead of the copy `az bicep` downloads.
        az config set bicep.use_binary_from_path=true --only-show-errors

        # Copy opencode config, if this environment provides one.
        if [ -d /data/opencode ]; then
          mkdir -p "$HOME/.config/opencode"
          cp /data/opencode/*.* "$HOME/.config/opencode/" 2>/dev/null || true
        fi

        echo "==> Ready:"
        bicep --version && opencode --version && gh --version && az version --output tsv --query '"azure-cli"' && pwsh --version

  # Compiles every template. Compilation surfaces both errors and linter
  # warnings, which is as far as validation can go without an Azure login.
  - id: bicep-build
    exec:
      component: iac
      workingDir: ${PROJECT_SOURCE}
      label: Build all Bicep templates
      group:
        kind: build
        isDefault: true
      commandLine: |
        set -euo pipefail
        export PATH="$TOOLS_HOME/bin:$PATH"
        rc=0
        for f in $(find infra -name '*.bicep' | sort); do
          echo "==> $f"
          bicep build "$f" --stdout > /dev/null || rc=1
        done
        exit $rc

  - id: bicep-lint
    exec:
      component: iac
      workingDir: ${PROJECT_SOURCE}
      label: Lint all Bicep templates
      commandLine: |
        set -euo pipefail
        export PATH="$TOOLS_HOME/bin:$PATH"
        rc=0
        for f in $(find infra -name '*.bicep' | sort); do
          echo "==> $f"
          bicep lint "$f" || rc=1
        done
        exit $rc

  - id: az-login
    exec:
      component: iac
      workingDir: ${PROJECT_SOURCE}
      label: Log in to Azure (device code)
      commandLine: |
        export PATH="$TOOLS_HOME/azure-cli/bin:$PATH"
        az login --use-device-code

  # Requires az-login. Validates the subscription-scope template against ARM
  # without creating anything; needs ARO_PULL_SECRET to be set.
  - id: aro-whatif
    exec:
      component: iac
      workingDir: ${PROJECT_SOURCE}/infra
      label: What-if the ARO deployment (requires az login)
      commandLine: |
        set -euo pipefail
        export PATH="$TOOLS_HOME/azure-cli/bin:$TOOLS_HOME/bin:$PATH"
        params=${WHATIF_PARAMS:-whatif.parameters.json}
        if [ ! -f "$params" ]; then
          echo "Create $params first (aro.bicep parameters, including pullSecret)." >&2
          exit 1
        fi
        location=$(python3 -c "import json;print(json.load(open('${CONFIG_FILE:-config.json}'))['location'])")
        az deployment sub what-if \
          --location "$location" \
          --template-file aro.bicep \
          --parameters "@$params"

events:
  postStart:
    - install-tooling
