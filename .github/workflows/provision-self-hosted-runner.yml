name: Provision Azure self-hosted runner

on:
  workflow_dispatch:
    inputs:
      location:
        description: Azure region for the runner VM
        required: true
        default: canadaeast
        type: string
      resource_group_name:
        description: Resource group for the runner VM
        required: true
        default: rg-sail-runners
        type: string
      vm_name:
        description: Azure VM and GitHub runner name
        required: true
        default: sail-github-runner
        type: string
      vm_size:
        description: Azure VM size
        required: true
        default: Standard_D2s_v5
        type: string
      vnet_resource_group_name:
        description: Resource group containing the existing VNet
        required: true
        type: string
      vnet_name:
        description: Existing VNet name
        required: true
        type: string
      subnet_name:
        description: Existing subnet name
        required: true
        type: string
      runner_labels:
        description: Comma-separated custom runner labels
        required: true
        default: sail-azure
        type: string

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: provision-sail-azure-runner
  cancel-in-progress: false

jobs:
  provision:
    name: Provision runner
    runs-on: ubuntu-latest
    environment: runner-provisioning
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sign in to Azure with OIDC
        uses: azure/login@f5d393aa5ad8707467f80c9b9b7785236f24ec00 # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Create runner registration token
        id: runner-token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          token="$(gh api \
            --method POST \
            "/repos/${GITHUB_REPOSITORY}/actions/runners/registration-token" \
            --jq '.token')"
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      - name: Deploy runner VM
        env:
          LOCATION: ${{ inputs.location }}
          RESOURCE_GROUP_NAME: ${{ inputs.resource_group_name }}
          RUNNER_LABELS: ${{ inputs.runner_labels }}
          RUNNER_TOKEN: ${{ steps.runner-token.outputs.token }}
          SUBNET_NAME: ${{ inputs.subnet_name }}
          VM_NAME: ${{ inputs.vm_name }}
          VM_SIZE: ${{ inputs.vm_size }}
          VNET_NAME: ${{ inputs.vnet_name }}
          VNET_RESOURCE_GROUP_NAME: ${{ inputs.vnet_resource_group_name }}
        run: |
          set -Eeuo pipefail

          az group create \
            --name "$RESOURCE_GROUP_NAME" \
            --location "$LOCATION" \
            --output none

          ssh-keygen \
            -t ed25519 \
            -N '' \
            -f "${RUNNER_TEMP}/runner-admin-key" \
            -C "$VM_NAME"

          bootstrap_script="$(base64 --wrap=0 infra/scripts/bootstrap-github-runner.sh)"
          tags="$(jq --compact-output --null-input \
            --arg repository "$GITHUB_REPOSITORY" \
            '{application: "SAIL", component: "github-runner", repository: $repository}')"

          az deployment group create \
            --name "github-runner-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --template-file infra/self-hosted-runner.bicep \
            --parameters \
              location="$LOCATION" \
              vmName="$VM_NAME" \
              vmSize="$VM_SIZE" \
              vnetResourceGroupName="$VNET_RESOURCE_GROUP_NAME" \
              vnetName="$VNET_NAME" \
              subnetName="$SUBNET_NAME" \
              adminSshPublicKey="$(cat "${RUNNER_TEMP}/runner-admin-key.pub")" \
              runnerUrl="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              runnerRegistrationToken="${RUNNER_TOKEN}" \
              runnerLabels="$RUNNER_LABELS" \
              bootstrapScriptBase64="${bootstrap_script}" \
              tags="$tags" \
            --output table
